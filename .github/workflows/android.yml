name: Build AJT124 Android APK
# Verify Android Lint and debug APK build on updates.

on:
  workflow_dispatch:
  push:
    branches:
      - android-app-setup
    paths:
      - "index.html"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "app/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Copy the existing game into the Android app
        run: |
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html

      - name: Run Android Lint and build the debug APK
        run: gradle --no-daemon lintDebug assembleDebug

      - name: Upload Android Lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AJT124-Android-Lint-Report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn

      - name: Upload APK for controlled testing only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AJT124-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
